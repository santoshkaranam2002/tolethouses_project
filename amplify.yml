version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Point the app at your API without touching code: set API_URL in
        # Amplify -> App settings -> Environment variables (e.g. https://xxxx.execute-api.ap-south-1.amazonaws.com/api)
        - echo "window.EC_CONFIG = { apiUrl: '${API_URL}' };" > public/config.js
        - npm run build
  artifacts:
    baseDirectory: dist/estatecraft/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
